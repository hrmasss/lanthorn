name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
  - type: markdown
    attributes:
      value: |
        Out of scope: ads, analytics, accounts, cloud sync and streaming catalogues.
