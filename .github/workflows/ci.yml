name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted pool on charulata when the repo variable RUNNER is set (hm-runner); GitHub-hosted otherwise.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # GitHub's image ships an Android SDK; the self-hosted runner does not. Installed once into
      # the runner's persisted home, then reused.
      - uses: android-actions/setup-android@v3
        if: runner.environment == 'self-hosted'
        with:
          # The default list still names 'tools', which Google no longer ships. Gradle fetches the
          # platform and build-tools it needs on its own once the licences are accepted.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Self-hosted runners keep ~/.gradle in a persisted volume; uploading it to GitHub's cache
          # after every job only adds minutes (seen 8+ min on a 2-core runner).
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      - name: Release key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.PLAYER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PLAYER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build, unit tests, lint
        env:
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease assembleBench assembleDebugAndroidTest testDebugUnitTest lint --console=plain

      - name: APK sizes
        run: find app/build/outputs/apk -name '*.apk' -printf '%s\t%p\n' | sort -n | tee -a "$GITHUB_STEP_SUMMARY"

      # NF-8 and the privacy audit: every library the release app ships, as Gradle resolved it.
      - name: Release dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > release-dependencies.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-dependencies
          path: release-dependencies.txt
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      # Small artifacts for emulator runs: downloads need no lock and run at about 0.3 MB/s on
      # hapl-aux, so each one holds a single x86_64 APK (test APKs carry x86_64 libraries only).
      #   gh run download <id> -R hrmasss/player-app -n app-debug-x86_64
      #   gh run download <id> -R hrmasss/player-app -n test-core-engine
      # A new module with instrumented tests adds its own step below.
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: app-bench-x86_64
          path: app/build/outputs/apk/bench/app-x86_64-bench.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-core-engine
          path: core/engine/build/outputs/apk/androidTest/debug/engine-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-core-data
          path: core/data/build/outputs/apk/androidTest/debug/data-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-core-designsystem
          path: core/designsystem/build/outputs/apk/androidTest/debug/designsystem-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-core-player-api
          path: core/player-api/build/outputs/apk/androidTest/debug/player-api-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-core-settings-api
          path: core/settings-api/build/outputs/apk/androidTest/debug/settings-api-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-feature-player
          path: feature/player/build/outputs/apk/androidTest/debug/player-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-feature-info
          path: feature/info/build/outputs/apk/androidTest/debug/info-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-feature-library
          path: feature/library/build/outputs/apk/androidTest/debug/library-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-feature-subtitles
          path: feature/subtitles/build/outputs/apk/androidTest/debug/subtitles-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-feature-audio
          path: feature/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-bench
          path: bench/build/outputs/apk/androidTest/debug/bench-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: test-app
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
